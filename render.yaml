# Render Blueprint – https://render.com/docs/blueprint-spec
services:
  - type: web
    name: beat-realcore-league
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: legacy-league-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TEAM_CODE
        generateValue: true
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
